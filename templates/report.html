<!DOCTYPE html>
<html>
<head>
    <title>Attendance Report</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>Attendance Report</h1>

    <table>
        <tr>
            <th>Name</th>
            <th>Roll No</th>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for row in records %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>{{ row[2] }}</td>
            <td>{{ row[3] }}</td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="/">
        <button>Back to Home</button>
    </a>

</div>

</body>
</html>
